name: Sync local horse racing detail CSVs
on:
  workflow_dispatch:
  schedule:
    - cron: '08,38 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/sync-local.yml']
permissions:
  contents: write
concurrency:
  group: public-csv-sync
  cancel-in-progress: false
jobs:
  sync-local:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Download and validate all four detail tables
        env:
          PUB_BASE: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRUzNOgE9JkyvwI6MIumor_UUMBabbimxK9dPma3HmcfC2RFyqecGBFtbzLqQgWGc85Za4WK9J8NUgc/pub'
        run: |
          python3 - <<'PY'
          import csv, io, json, os, pathlib, subprocess, tempfile
          from datetime import datetime, timezone
          from urllib.parse import urlencode

          tables = {
              'ark-local-results.csv': (8101, 'レコードID,レースID,開催日,競馬場,R番号,競走名,クラス,所属地区,芝ダート,距離m,コース方向,砂質,天候,馬場,発走時刻JST,枠番,馬番,馬ID,馬名,性齢,斤量kg,騎手,騎手ID,調教師,調教師ID,厩舎所属,移籍元,転入後出走数,前走からの日数,馬体重kg,増減kg,出走状態,着順,着差,走破秒,1角,2角,3角,4角,上がり3F秒,最終人気,最終単勝オッズ,情報発表時刻JST,取得時刻JST,出典URL,欠測・補足'),
              'ark-local-training.csv': (8102, 'レコードID,レースID,開催日,競馬場,馬番,馬ID,馬名,調教師,厩舎所属,調教日,調教場所,コース,馬場,騎乗者,調教種別,負荷,距離m,全体秒,5F秒,4F秒,3F秒,2F秒,1F秒,併せ馬情報,調教本数,陣営コメント,情報発表時刻JST,取得時刻JST,出典URL,欠測・補足'),
              'ark-local-market.csv': (8103, 'レコードID,レースID,開催日,競馬場,データ種別,券種,馬番組合せ,観測時刻JST,人気,オッズ下限,オッズ上限,100円払戻円,発売・確定状態,情報発表時刻JST,取得時刻JST,出典URL,欠測・補足'),
              'ark-local-stable-jockey.csv': (8104, 'レコードID,集計対象,調教師ID,調教師,厩舎所属,騎手ID,騎手,競馬場,距離m,クラス,馬場,対象条件,期間開始,期間終了,出走数,1着数,2着数,3着数,勝率%,複勝率%,仮想投資円,仮想払戻円,回収率%,対照・調整法,情報基準日,取得時刻JST,出典URL,欠測・補足'),
          }
          def parse(text, expected):
              reader = csv.reader(io.StringIO(text, newline=''), strict=True)
              header = next(reader, [])
              if header != expected:
                  raise ValueError('Unexpected header (check sheet publishing settings)')
              rows = [r for r in reader if any(r)]
              ids = set()
              source = expected.index('出典URL')
              for row in rows:
                  if len(row) != len(header):
                      raise ValueError('Malformed record width')
                  if not row[0].strip() or row[0] in ids:
                      raise ValueError('Missing or duplicate record ID')
                  if not row[source].strip().startswith(('https://', 'http://')):
                      raise ValueError('Missing source URL')
                  ids.add(row[0])
              return header, rows, ids

          output, info = {}, {}
          for filename, (gid, header_text) in tables.items():
              header = header_text.split(',')
              url = os.environ['PUB_BASE'] + '?' + urlencode({'gid': gid, 'single': 'true', 'output': 'csv'})
              with tempfile.TemporaryDirectory() as temp:
                  path = pathlib.Path(temp) / 'source.csv'
                  subprocess.run(['curl', '--fail', '--silent', '--show-error', '--location', '--retry', '2', '--max-time', '45', '--max-filesize', '20971520', url, '-o', str(path)], check=True)
                  text = path.read_bytes().decode('utf-8-sig')
              _, rows, ids = parse(text, header)
              previous = pathlib.Path(filename)
              if previous.exists():
                  _, old_rows, old_ids = parse(previous.read_text(encoding='utf-8-sig'), header)
                  if old_ids - ids:
                      raise ValueError(f'{filename}: existing IDs would be lost')
                  old_by_id = {r[0]: r for r in old_rows}
                  if any(r[0] in old_by_id and old_by_id[r[0]] != r for r in rows):
                      raise ValueError(f'{filename}: existing records changed; append a new version instead')
              buffer = io.StringIO(newline='')
              writer = csv.writer(buffer, lineterminator='\n')
              writer.writerow(header)
              writer.writerows(rows)
              output[filename] = buffer.getvalue()
              info[filename] = {'gid': gid, 'columns': len(header), 'records': len(rows)}
              print(filename, info[filename])
          # Write only after all four tables pass checks. Do not modify the main 70-column CSV.
          for filename, text in output.items():
              pathlib.Path(filename).write_bytes(text.encode('utf-8'))
          pathlib.Path('ark-local-index.json').write_text(json.dumps({'schema_version': 1, 'checked_at_utc': datetime.now(timezone.utc).isoformat(), 'tables': info}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Publish validated detail CSVs
        run: |
          git add -- ark-local-results.csv ark-local-training.csv ark-local-market.csv ark-local-stable-jockey.csv ark-local-index.json
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Sync validated local horse racing detail CSVs'
          git push origin HEAD:main
